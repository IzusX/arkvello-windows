name: Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build Win32 components
        shell: cmd
        run: scripts\build-windows.cmd
      - name: Archive round-trip smoke tests
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Build native UI integration test
        shell: cmd
        run: scripts\build-native-ui-test.cmd
      - name: Native UI and GUI archive round-trip tests
        shell: pwsh
        run: ./scripts/test-native-ui.ps1 -EvidenceDirectory ./build/native-ui-ci
      - name: Upload development binaries
        uses: actions/upload-artifact@v6
        with:
          name: arkvello-windows-development-x64
          path: build/windows-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-ui-evidence-x64
          path: build/native-ui-ci/
          if-no-files-found: warn
          retention-days: 14
