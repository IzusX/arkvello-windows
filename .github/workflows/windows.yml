name: Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build original Win32 components
        shell: cmd
        run: scripts\build-windows.cmd
      - name: Archive round-trip smoke tests
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Upload baseline binaries
        uses: actions/upload-artifact@v6
        with:
          name: arkvello-windows-baseline-x64
          path: build/windows-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14
